# Builds flint for Windows x64. The macOS build is made and signed locally.
#
# Started by hand:
#   gh workflow run release.yml
# The zip stays on the run as an artifact, named with the version from Cargo.toml.
name: release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: windows-x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # With no arguments rustup installs the compiler pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          Compress-Archive `
            -Path target/release/flint.exe, LICENSE, THIRD-PARTY.md, `
              assets/fonts/CascadiaCode-LICENSE.txt, assets/icons/LUCIDE-LICENSE.txt `
            -DestinationPath "Flint-$version-windows-x86_64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: Flint-*.zip
          if-no-files-found: error

[package]
name = "flint"
version = "0.1.4"
edition = "2021"
description = "SSH and SFTP client"
license = "GPL-3.0-only"
repository = "https://github.com/mousEHEHE/flint-gpui"
rust-version = "1.98"
publish = false

[package.metadata.bundle]
name = "Flint"
identifier = "com.mouse.flint"
icon = ["assets/app-icon/icon@2x.png", "assets/app-icon/icon_512.png"]
category = "public.app-category.developer-tools"
osx_minimum_system_version = "12.0"

[dependencies]
# SSH, terminal emulator, vault and sync. Shared with flint-mobile.
flint-core = { path = "../flint-core" }

gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = "=0.7.3"
gpui-kit-assets = "=0.7.3"

rust-embed = { version = "8", features = ["include-exclude"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
russh = "0.45"
rfd = "0.14"
notify = "=8.2.0"
tokio = { version = "1", features = ["rt", "macros", "fs", "io-util", "net", "sync", "time"] }
base64 = "0.22"
async-channel = "2"
futures = "0.3"
gif = "0.14"

secrecy = "0.8"
zeroize = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }

ureq = { version = "2", features = ["json"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = ["Win32_System_Memory", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security_Credentials"] }
winreg = "0.52"
# Termius local import (Windows only): NaCl secretbox field decryption and
# Snappy blocks in the IndexedDB LevelDB tables.
crypto_secretbox = "0.1"
snap = "1"

[dev-dependencies]
tempfile = "3"

# Style lints that the UI code trips on purpose: gpui handlers take many
# arguments, and events carry whole entries.
[lints.clippy]
too_many_arguments = "allow"
large_enum_variant = "allow"
type_complexity = "allow"

# build.rs uses these to make the .ico and put it into the .exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
ico = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }

# gpui and alacritty are too slow to use unoptimized, even in a debug build.
[profile.dev.package."*"]
opt-level = 3

# Symbols are stripped, so a panic backtrace in a release build has no function names.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
